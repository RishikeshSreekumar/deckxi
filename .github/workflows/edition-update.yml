name: Weekly edition update

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Re-derives every card from Cricsheet's latest T20I data (downloaded
      # fresh), keeps names/photos from the committed cache and fetches
      # photos only for newcomers. See docs/data-sources.md.
      - name: Refresh the edition from Cricsheet
        id: refresh
        run: |
          {
            echo "summary<<EOF"
            pnpm --silent --filter @deckxi/data import-cricsheet --photos
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate updated edition
        run: pnpm --filter @deckxi/data check

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/weekly-edition-update
          commit-message: "data: weekly edition refresh from Cricsheet"
          title: "Weekly edition update"
          body: |
            Automated weekly refresh of the shipped edition from Cricsheet's men's T20I
            data (`import-cricsheet`; derived, so re-running on the same snapshot is a no-op).

            ```
            ${{ steps.refresh.outputs.summary }}
            ```

            The edition validation + balance report runs in CI on this PR; review the
            stat diff, any squad changes and any new photo credits before merging.
          labels: task, phase-2
          delete-branch: true
