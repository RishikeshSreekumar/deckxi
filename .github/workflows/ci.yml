name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Server image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: deckxi-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot it and hit /health
        run: |
          docker run -d --name api -p 3001:3001 deckxi-server:ci
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3001/health && ok=1 && break
            sleep 2
          done
          docker logs api
          test "${ok:-0}" = 1

  ci:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Design tokens up to date
        run: pnpm tokens:check

      - name: Contrast audit (WCAG AA)
        run: pnpm --filter @deckxi/ui contrast:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Edition validation + balance report
        run: pnpm --filter @deckxi/data check

      # A schema change without a generated migration would deploy code that
      # expects columns the database doesn't have.
      - name: Migrations match the schema
        run: |
          pnpm --filter @deckxi/server exec drizzle-kit generate
          if ! git diff --quiet -- apps/server/drizzle; then
            echo "::error::src/db/schema.ts has changes with no migration — run 'pnpm --filter @deckxi/server db:generate' and commit the result."
            git --no-pager diff --stat -- apps/server/drizzle
            exit 1
          fi
